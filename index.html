<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>朝早新聞 · 每日更新</title>
  <meta name="theme-color" content="#0a1020" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="朝早新聞" />
  <link rel="manifest" href="site.webmanifest" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <script>
(function(){
  try {
    var s = parseInt(localStorage.getItem("dd-font") || "17", 10);
    if (isNaN(s)) s = 17;
    s = Math.max(14, Math.min(22, s));
    document.documentElement.style.setProperty("--base-font", s + "px");
  } catch (e) {}
})();
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1>朝早新聞</h1>
      <button type="button" class="refresh-btn" id="refresh-btn" title="重新載入頁面" aria-label="重新載入">↻ F5</button>
      <div class="font-controls" id="font-controls" aria-label="字體大小">
        <button type="button" class="font-btn" id="font-minus" title="縮小字體" aria-label="縮小字體">A−</button>
        <button type="button" class="font-btn" id="font-plus" title="放大字體" aria-label="放大字體">A+</button>
      </div>
    </header>
    <div class="date-nav">
      <div class="date-controls">
        <button type="button" class="date-step" id="date-prev" title="前一日" aria-label="前一日">←</button>
        <label for="date-picker">揀日期</label>
        <input id="date-picker" type="date" />
        <button type="button" class="date-step" id="date-next" title="下一日" aria-label="下一日">→</button>
        <button type="button" class="date-today" id="date-today" title="跳去今日（香港時間）">今日</button>
      </div>
      <span class="meta" id="page-meta"></span>
    </div>
    <div id="report"></div>
    <footer>新聞bot · 讀取 <code>data/news-YYYY-MM-DD.json</code></footer>
  </div>
  <script src="js/app.js"></script>
  <script>DailyDash.initPage("news");</script>
</body>
</html>
